name: pkg.pr.new
on:
  pull_request:
    types: [opened, reopened, synchronize]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build
      - name: Rewrite History for Changesets
        id: sekai
        run: |
          # For Commit
          git config user.name "GitHub Actions Bot";
          git config user.email "<>";
          # For Fetching Base Branch
          git fetch origin ${{ github.base_ref }};
          BASE_REF=$(git rev-parse origin/${{ github.base_ref }});
          echo "base_ref=$BASE_REF" >> $GITHUB_OUTPUT;
          # Rewrite History
          HEAD_TREE=$(git rev-parse HEAD^{tree});
          HASH=$(git commit-tree -p $BASE_REF -m 'rewrite history' $HEAD_TREE);
          git checkout $HASH;
      - name: List up Packages with Changesets
        run: pnpm changeset status --since ${{ steps.sekai.outputs.base_ref }} --output changeset.json
      - name: Publish Packages with Changesets
        run: |
          mapfile -t package_names < <(jq -r '.releases | map(.name) | unique[]' changeset.json)
          if (( ${#package_names[@]} == 0 )); then
            echo "No packages with changesets to publish."
            exit 0
          fi

          package_dirs=()
          for package_name in "${package_names[@]}"; do
            package_dir=$(pnpm --filter "$package_name" exec pwd)
            echo "$package_name -> $package_dir"
            package_dirs+=("$package_dir")
          done

          pnpm dlx pkg-pr-new publish --pnpm --packageManager=pnpm "${package_dirs[@]}"
