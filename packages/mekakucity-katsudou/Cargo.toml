[package]
name = "katsudou"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
axum = "=0.8.9"
deno_core = "=0.413.0"
hyper = "=1.12.0"
hyper-util = { version = "=0.1.21", features = ["http1", "server-auto", "service", "tokio"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[dev-dependencies]
socket2 = "=0.6.5"
